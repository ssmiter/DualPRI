name: iscale
channels:
  - pytorch
  - nvidia
  - nvidia/label/cuda-11.8.0
  - pyg
  - conda-forge
dependencies:
  - python=3.10.16
  - pip
  - packaging=24.2
  # PyTorch runtime used for the manuscript experiments.
  - pytorch=2.0.0
  - torchvision=0.15.0
  - torchaudio=2.0.0
  - pytorch-cuda=11.7
  # Compiler toolchain present when the custom CUDA extensions were built.
  - cuda-nvcc=11.8.89
  - pyg=2.6.1
  - pytorch-scatter=2.1.1
  - numpy=1.26.3
  - pandas=1.5.2
  - scipy=1.14.1
  - scikit-learn=1.6.0
  - matplotlib=3.10.0
  - seaborn=0.13.2
  - biopython=1.85
  - pyyaml=6.0.2
  - tqdm=4.66.5
  - pip:
      - einops==0.8.0
      - networkx==3.4.2
      - ninja==1.11.1.3
      - triton==2.2.0
